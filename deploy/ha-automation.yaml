# Home Assistant automation: Race Watch posts to this webhook when live data
# stops (and again when it comes back); this forwards it to your phone.
# The racewatch service sends to (RACEWATCH_ALERT_WEBHOOK in its env file):
#   RACEWATCH_ALERT_WEBHOOK=http://127.0.0.1:8123/api/webhook/racewatch-alert-<random>
- id: racewatch_feed_alert
  alias: Race Watch feed alert
  mode: queued
  trigger:
    - platform: webhook
      webhook_id: WEBHOOK_ID
      allowed_methods: [POST]
      local_only: true
  action:
    - service: NOTIFY_SERVICE
      data:
        title: "{{ trigger.json.title }}"
        message: "{{ trigger.json.message }}"
        data:
          push:
            interruption-level: time-sensitive
